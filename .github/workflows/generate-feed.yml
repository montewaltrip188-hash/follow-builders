name: Generate Feeds

on:
  schedule:
    # All feeds (tweets, podcasts, blogs): once daily at 6:17am UTC
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to fetch'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tweets-only
          - podcasts-only
          - blogs-only

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Run feed generator tests
        run: cd scripts && npm test

      - name: Generate feeds
        run: cd scripts && node generate-feed.js --blogs-only

      - name: Sync X and podcast feeds from upstream
        run: |
          curl --fail --location --retry 2 --retry-all-errors \
            --output feed-x.json \
            https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-x.json
          curl --fail --location --retry 2 --retry-all-errors \
            --output feed-podcasts.json \
            https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-podcasts.json

      - name: Commit and push feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json
          git diff --cached --quiet || git commit -m "chore: update feeds [skip ci]"
          git push
